function createINatMarkersToggle(map) {
  const controlButton = document.createElement("button");

  // Set CSS for the control.
  controlButton.style.backgroundColor = "#fff";
  controlButton.style.border = "2px solid #fff";
  controlButton.style.borderRadius = "3px";
  controlButton.style.boxShadow = "0 2px 6px rgba(0,0,0,.3)";
  controlButton.style.color = "rgb(25,25,25)";
  controlButton.style.cursor = "pointer";
  controlButton.style.fontFamily = "Roboto,Arial,sans-serif";
  controlButton.style.fontSize = "16px";
  controlButton.style.lineHeight = "38px";
  controlButton.style.margin = "8px 0 22px";
  controlButton.style.padding = "0 5px";
  controlButton.style.textAlign = "center";
  controlButton.textContent = "iNaturalist Reports";
  controlButton.type = "button";
  controlButton.addEventListener("click", () => {
      if(iNatMarkers[0].map == null){
         iNatMarkers.forEach(function(m) {m.map = map;})
         }
      else{
         iNatMarkers.forEach(function(m) {m.map = null;})
         }
     });
  return controlButton;
  }

//------------------------------------------------------------
async function initMap() {
   const {Map} = await google.maps.importLibrary("maps");
   const {AdvancedMarkerElement, PinElement, InfoWindow} = await google.maps.importLibrary("marker");
   //const { MarkerClusterer } = await google.maps.importLibrary("marker");
   //const {MarkerClusterer} = await google.maps.importLibrary("markerclusterer");
   // import { MarkerClusterer } from "@googlemaps/markerclusterer";
     
   var map = new google.maps.Map(document.getElementById('map'), {
       zoom: 7,
       center: {lat: 47.2277, lng: -122.3555},
       mapTypeId: google.maps.MapTypeId.TERRAIN,
       mapId: "DEMO_MAP_ID"
       });

    map.addListener("click", (mapsMouseEvent) => {
      console.log(JSON.stringify(mapsMouseEvent.latLng.toJSON(), null, 2))
      });
      
   const inatObs = await readINaturalistData()
   drawInaturalistSites(map, inatObs)

   const uwObs = await readUWData()
   drawUWSites(map, uwObs)

      //------------------
      // load county layer
      //------------------

   var countyLayer = new google.maps.Data()
   let jsonFile1 = "WA_County_Boundaries.geojson"
   countyLayer.loadGeoJson(jsonFile1)
   window.countyLayer = countyLayer;          
   countyLayer.setMap(null);

      //-----------------------
      // load state parks layer
      //-----------------------

   var parksLayer = new google.maps.Data()
   let jsonFile2 = "waParksBoundaries.geojson"
   parksLayer.loadGeoJson(jsonFile2)
   parksLayer.setMap(null);
   window.parksLayer = parksLayer;

      //-----------------------
      // load DNR layer
      //-----------------------
    var dnrLayer  = new google.maps.Data();
    let jsonFile3 = "WA_DNR_Managed_Land_Parcels.geojson"
    dnrLayer.loadGeoJson(jsonFile3)
      dnrLayer.setMap(null);
    window.dnrLayer = dnrLayer

      //----------------------------------
      // create and display toggle buttons
      //----------------------------------


   const centerControlDiv = document.createElement("div");
   const label = createToggleButtonsLabel()
   centerControlDiv.appendChild(label)

   const uwMarkersToggleButton = createUWMarkersToggle(map);
   centerControlDiv.appendChild(uwMarkersToggleButton)

   const inatMarkersToggleButton = createINatMarkersToggle(map);
   centerControlDiv.appendChild(inatMarkersToggleButton)




   const countiesToggleButton = createCountiesToggle(map);
   centerControlDiv.appendChild(countiesToggleButton)

   const parksToggleButton = createStateParksToggle(map);
   centerControlDiv.appendChild(parksToggleButton)

   const dnrToggleButton = createDNRToggle(map);
   centerControlDiv.appendChild(dnrToggleButton)

   map.controls[google.maps.ControlPosition.TOP_CENTER].push(centerControlDiv);

} // initMap

async function drawInaturalistSites(map, inatObs)
{
  console.log("report count: " + inatObs.length)

  let options = google.maps.marker.PinElementOptions
  const pinBlue = new google.maps.marker.PinElement({ background: "#0000FF" });    
  let pin = new google.maps.marker.PinElement({
      scale: 0.5,
      background: '#FBBC04'
      });

  inatObs.forEach(function(report){
      var iNatLayer = new google.maps.Data()
      iNatLayer.setMap(map);
      window.iNatLayer = iNatLayer;
      var size = 5; 
      const pinRed = new google.maps.marker.PinElement({
           background: "#FF0000",
           scale: 0.3});    
      const marker = new google.maps.marker.AdvancedMarkerElement({
          position: {lat:  report["lat"], lng: report["lon"]},
          map: null,
          title: report["siteName"],
          content: pinRed.element,
          gmpClickable: true
          })
      let infoHTML =  "<h4> fern observation</h4>" +
             "<ul>" +
               "<li> by: " + report["user"] +
               "<li> date: " + report["date"] +
               "</ul>" +
               "<p>" + 
          report["description"] +
          "<br>" + 
          "<img src='" + report["url"] + "'>"
      //console.log("description: " + report["description"])
      let infoWindow = new google.maps.InfoWindow();
      marker.addListener("click", ({ domEvent, latLng }) => {
         const {target} = domEvent;
         infoWindow.close();
         infoWindow.setContent(infoHTML);
         //infoWindow.setContent(marker.title);
         infoWindow.open(marker.map, marker);
         });
      iNatMarkers.push(marker)
      }) // forEach

} // drawInaturalistSites
//------------------------------------------------------------
async function drawUWSites(map, uwObs)
{
  console.log("uw site count: " + uwObs.length)

  let options = google.maps.marker.PinElementOptions
  const pinBlue = new google.maps.marker.PinElement({ background: "#0000FF" });    
  let pin = new google.maps.marker.PinElement({
      scale: 0.5,
      background: '#FBBC04'
      });

  uwObs.forEach(function(obs){
      var uwLayer = new google.maps.Data()
      uwLayer.setMap(map);
      window.uwLayer = uwLayer;
      const brown = "#734d26"
      const green = "#009900"; //"#00cc00";
      let deadSize = obs['sickOrDeadFernCount']
      if(deadSize == 0){
         deadSize = 1
         }
      deadSize = Math.log(deadSize)/3;
      const liveSize = 0.7; //obs['healthyFernCount']
      // console.log("deadSize: " + deadSize);
      const pinBrown = new google.maps.marker.PinElement({
           background: brown,  // "#0000FF",
           glyphColor: brown,
           borderColor: brown,
           scale: deadSize});    
      const pinGreen = new google.maps.marker.PinElement({
           background: green,
           glyphColor: green,
           borderColor: "#000000",
           scale: liveSize});    
      let pin = pinBrown;
      if(obs['sickOrDeadFernCount'] == 0){
         pin = pinGreen;  
         }
      const marker = new google.maps.marker.AdvancedMarkerElement({
          position: {lat:  obs["lat"], lng: obs["lon"]},
          map: map,
          title: obs["siteName"],
          content: pin.element,
          gmpClickable: true
          })
    //console.log("--- photos");
    const photoString = obs['photos']
    //console.log(obs["photos"])
    let infoHTML = "<h3>UW observation: ";
      infoHTML += obs['siteName'];
      infoHTML += "</h3>"; 
      infoHTML += "<ul>";
      infoHTML += "<li> observer: " + obs['observer'];
      infoHTML += "<li> " + obs['date'];
      infoHTML += "<li> " + obs['lat'];
      infoHTML += "<li> " + obs['lon'];
      infoHTML += "<li> elevation: " + obs['elevation'];
      infoHTML += "<li> slope: " + obs['slope'];
      infoHTML += "<li> aspect: " + obs['aspect'];
      infoHTML += "<li> area: " + obs['area'] + " sq.ft.";
      infoHTML += "<li> dead fern count: " + obs['sickOrDeadFernCount'];
      infoHTML += "<li> healthy fern count: " + obs['healthyFernCount'];
      infoHTML += "<li> mortality rate: " + obs['mortality'];
      infoHTML += "<li> canopy type: " + obs['canopyType'];
      infoHTML += "<li> canopy density: " + obs['canopyDensity'];
      infoHTML += "<li> dead class 1: " + obs['dead.Class.1'];
      infoHTML += "<li> dead class 2: " + obs['dead.Class.2'];
      infoHTML += "<li> dead class 3: " + obs['dead.Class.3'];
      infoHTML += "<li> dead class 4: " + obs['dead.Class.4'];
      infoHTML += "<li> notes: " + obs['notes'];
      infoHTML += "</ul>";
      if(photoString != ''){
          let urls = photoString.split(' | ')
          //console.log("url count: " + urls.length);
          urls.forEach(function(url){
             //console.log(url)
             infoHTML += '<br><br><img src="' + url + '" width=400>';
             }) // foreach url
          } // if photoString

      let infoWindow = new google.maps.InfoWindow();
      marker.addListener("click", function(domEvent, latLng){
         const {target} = domEvent;
         infoWindow.close();
         infoWindow.setContent(infoHTML);
         infoWindow.open(marker.map, marker);
         });
      uwMarkers.push(marker)
      })// forEach

   // var mc = MarkerClusterer(uwMarkers, map);
   //new markerClusterer.MarkerClusterer({uwMarkers, map})
   new markerClusterer.MarkerClusterer({uwMarkers, map})
   //const markerCluster = new MarkerClusterer({map, uwMarkers });

} // drawUWSites
